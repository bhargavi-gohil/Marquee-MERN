<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light &amp; Dark Theme</title>
    <style>
        [data-theme="dark"] {
            color-scheme: dark;
            --background: #111827;
            --text: #f9fafb;
            --card: #1f2937;
            --accent: #60a5fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .card {
            padding: 2rem;
            text-align: center;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgb(0 0 0 / 15%);
        }

        button {
            padding: 0.7rem 1rem;
            border: 0;
            border-radius: 6px;
            background: rgb(58, 68, 31);
            color: rgb(88, 107, 73);
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Theme </h1>
        <p>Switch between light and dark mode.</p>
        <button id="themeToggle" type="button" aria-label="Switch to dark theme">
            🌙 Dark theme
        </button>
    </main>

    <script>
        const root = document.documentElement;
        const toggle = document.getElementById('themeToggle');

        toggle.addEventListener('click', () => {
            const isDark = root.dataset.theme !== 'dark';
            root.dataset.theme = isDark ? 'dark' : 'light';
            toggle.textContent = isDark ? '☀️ Light theme' : '🌙 Dark theme';
            toggle.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
        });
    </script>
</body>
</html>
