<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management</title>
  </head>
  <body>
    <header>
      <h1>Student Application Management System</h1>
      <p>Register and manage student applications</p>
    </header>

    <main>
        <!-- Form -->
      <section>
        <h2>Student registration form</h2>
        <form action="submit">
          <div class="form">
            <div>
              <label for="name">Student Name: </label>
              <input type="text" id="name" required />
            </div>
            <div>
              <label for="email">Email: </label>
              <input type="email" id="email" required />
            </div>
            <div>
              <label for="phone">Phone Number: </label>
              <input type="text" id="phone" required />
            </div>
            <div>
              <label for="dob">Date of Birth</label>
              <input type="date" id="dob" required />
            </div>
            <div>
              <label>Gender</label>
              <input type="radio" name="gender" /> Male
              <input type="radio" name="gender" /> Female
              <input type="radio" name="gender" /> Other
            </div>
            <div>
              <label>Course</label>
              <select required>
                <option>Select Course</option>
                <option>Web Development</option>
                <option>UI/UX</option>
                <option>Python</option>
                <option>Data Analytics</option>
                <option>MERN Stack</option>
                <option>Cloud Computing</option>
              </select>
            </div>

            <div>
              <label>Skills</label>
              <input type="checkbox" /> HTML <input type="checkbox" /> CSS
              <input type="checkbox" /> JavaScript <input type="checkbox" /> Git
              <input type="checkbox" /> React <input type="checkbox" /> Node.js
            </div>
            <div>
              <label>Profile Photo</label>
              <input type="file" accept="image/*" />
            </div>
            <div class="full">
              <label>About Student</label>
              <textarea
                maxlength="200"
                placeholder="Maximum 200 characters"
              ></textarea>
            </div>

            <div class="full">
              <button type="submit">Register</button>
              <button type="reset">Reset</button>
            </div>
          </div>
        </form>


      </section>
      <!-- statistic -->
    </main>
  </body>
</html>
