<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb💡</title>
    <style>
        :root{
            --bg-1: #0f1724;
            --bg-2: #081226;
            --accent: #ffd54a;
            --muted: #9aa4b2;
        }
        html,body{height:100%;}
        body{
            margin:0;
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            background: linear-gradient(180deg,var(--bg-1),var(--bg-2));
            color: #eef2f7;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px 16px;
        }
        fieldset{
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.06));
            border: 1px solid rgba(255,255,255,0.06);
            border-radius:12px;
            padding:24px 28px;
            width:320px;
            box-shadow: 0 8px 40px rgba(2,6,23,0.6);
        }
        legend{
            color: var(--accent);
            font-weight:700;
            letter-spacing:0.4px;
        }
        #bulb{
            width:120px;
            height:120px;
            border-radius:50%;
            background:gray;
            margin: 18px auto;
            box-shadow: 0 8px 18px rgba(0,0,0,0.6) inset;
            transition: box-shadow .25s ease, background-color .25s ease, transform .12s ease;
        }
        #bulb.on{
            background: radial-gradient(circle at 30% 30%, #fff9c4 0%, #ffd54a 30%, #ffb300 60%);
            box-shadow: 0 0 40px 14px rgba(255,200,50,0.18), inset 0 -8px 24px rgba(0,0,0,0.25);
            transform: translateY(-2px);
        }
        .btn{ text-align:center; margin-top:12px; }
        .btn button{
            padding:10px 18px;
            margin:0 8px;
            border-radius:8px;
            border:none;
            cursor:pointer;
            font-weight:600;
            color:#10202a;
            box-shadow: 0 6px rgba(0,0,0,0.25);
            transition: transform .08s ease, box-shadow .08s ease;
        }
        .btn button:active{ transform: translateY(1px); }
        #btnOn{ background: linear-gradient(180deg,#fff59d,#ffb300); }
        #btnOff{ background: linear-gradient(180deg,#e6e6e6,#bdbdbd); }
        @media (max-width:420px){ fieldset{ width:100%; padding:18px; } }
    </style>
</head>
<body>
    <fieldset>
        <legend>Click On/Off</legend>
        <div id="bulb"></div>
    </fieldset>
    <div class="btn">
        <button id="btnOn">ON</button>
        <button id="btnOff">OFF</button>
    </div>
    <script>
        const onBtn = document.getElementById('btnOn');
        const offBtn = document.getElementById('btnOff');
        const bulb = document.getElementById('bulb');

        onBtn.addEventListener('click', function() {
            bulb.classList.add('on');
        });

        offBtn.addEventListener('click', function() {
            bulb.classList.remove('on');
        });
    </script>
</body>
</html>
