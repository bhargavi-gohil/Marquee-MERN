<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Property</title>
</head>
<body>
    <fieldset>
        <legend>Style Property</legend>
        <p id="ppara" class="para">
            Lorem ipsum dolor sit amet, consectetur adipisicing elit. Facilis id totam asperiores incidunt laudantium reprehenderit? Consequuntur inventore distinctio excepturi dicta? Aspernatur tempore pariatur aliquid eos fuga nemo, necessitatibus quisquam incidunt?
        </p>
    </fieldset>

    <script>
        // Correct ID
        let p = document.getElementById('ppara');

        // Apply styles individually
        p.style.color = "blue";
        p.style.fontSize = "18px";
        p.style.fontWeight = "bold";

        // style cssText -> it allows you to set multiple styles at once
        p.style.cssText = "color: green; font-size: 1.6rem;";
        console.log(p);

        // classList -> add, remove, toggle, contains
        p.classList.add("para");
        // p.classList.remove("para");
        p.classList.replace("para", "para1");
        // p.classList.toggle("para1"); // add if not present, remove if present
        console.log(p.classList.contains("para1"));

    </script>
</body>
</html>
