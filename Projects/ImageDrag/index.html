<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        #container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .containers {
            min-height: 300px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            align-content: flex-start;
            justify-items: center;
            border: 2px solid black;
        }

        .containers:nth-child(1) {
            background: lightgray;
        }

        .containers:nth-child(2) {
            background: lightgray;
        }

        .draggable {
            width: 110px;
            height: 110px;
            object-fit: cover;
            cursor: grab;
            border: 2px solid black;
        }

        .dragging {
            opacity: 0.5;
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <div id="container">

        <div class="containers">
            <img class="draggable" src="https://i.pinimg.com/736x/f2/20/e5/f220e5f58879708b70f02b580852e504.jpg"
                draggable="true" alt="Drag and drop image" title="Drag and drop image">
            <img class="draggable" src="https://i.pinimg.com/736x/56/04/46/560446e5a1a0472a4c2261cf7962805b.jpg"
                draggable="true" alt="Drag and drop image" title="Drag and drop image">

                draggable="true" alt="Drag and drop image" title="Drag and drop image">
